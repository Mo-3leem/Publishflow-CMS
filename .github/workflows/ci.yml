name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never touches a developer database; everything lives under ./ci-tmp.
  DATABASE_PATH: ./ci-tmp/publishflow.db
  UPLOAD_DIR: ./ci-tmp/uploads
  APP_URL: http://localhost:3000
  NODE_ENV: development
  SESSION_COOKIE_NAME: pf_session
  SESSION_TTL_HOURS: '168'
  MAX_JSON_BYTES: '1048576'
  MAX_UPLOAD_BYTES: '5242880'
  TRUST_PROXY: 'false'
  ENABLE_FTS: 'true'
  SITE_TIMEZONE: UTC
  LOG_LEVEL: error
  SEED_ADMIN_EMAIL: admin@publishflow.local
  SEED_ADMIN_PASSWORD: AdminDemo123!ChangeMe
  SEED_EDITOR_EMAIL: editor@publishflow.local
  SEED_EDITOR_PASSWORD: EditorDemo123!ChangeMe
  SEED_AUTHOR_EMAIL: author@publishflow.local
  SEED_AUTHOR_PASSWORD: AuthorDemo123!ChangeMe
  SEED_AUTHOR2_EMAIL: author2@publishflow.local
  SEED_AUTHOR2_PASSWORD: Author2Demo123!ChangeMe

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Secrets are generated per run: CI must never depend on a committed .env.
      - name: Generate a CI environment
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "CSRF_SECRET=$(openssl rand -hex 32)"
            echo "VIEWER_HASH_SECRET=$(openssl rand -hex 32)"
            echo "SCHEDULE_JOB_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
          mkdir -p ci-tmp/uploads

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed the database
        run: pnpm db:seed

      - name: Verify database integrity
        run: pnpm db:check

      - name: Unit and integration tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload coverage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Proves the multi-stage build and the standalone runtime artifact are
      # sound, which the `next start` based E2E run does not cover.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: publishflow-cms:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the container and check its health
        run: |
          docker run -d --name publishflow-ci -p 3000:3000 \
            -e APP_URL=http://localhost:3000 \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e CSRF_SECRET="$(openssl rand -hex 32)" \
            -e VIEWER_HASH_SECRET="$(openssl rand -hex 32)" \
            -e SCHEDULE_JOB_SECRET="$(openssl rand -hex 32)" \
            publishflow-cms:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/v1/health | grep -q '"status":"ok"'; then
              echo "Container is healthy."
              docker rm -f publishflow-ci
              exit 0
            fi
            sleep 2
          done

          echo "The container never became healthy." >&2
          docker logs publishflow-ci
          docker rm -f publishflow-ci
          exit 1
